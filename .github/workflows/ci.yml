name: Source package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build source ZIP from the checked-out allowlist
        run: python -B release.py --source-only --out token-killer-source.zip
      - name: Test the extracted package
        shell: bash
        run: |
          python -B -c "from zipfile import ZipFile; ZipFile('token-killer-source.zip').extractall('dist-check')"
          cd dist-check
          python -B -m pip install -r requirements.txt
          python -B -m unittest discover -s research_games -v
          python -B -m unittest discover -s 自动运行 -p test_quota.py -v
          python -B -m unittest discover -s 自动运行 -p test_release.py -v
          python -B -m unittest discover -s 自动运行 -p test_lab.py -v
          python -B -m unittest discover -s 自动运行 -p test_benchmark.py -v
          python -B -m unittest discover -s 自动运行 -p test_benchmark_proof.py -v
          python -B -m unittest discover -s 自动运行 -p test_evidence.py -v
          python -B -m unittest discover -s 自动运行 -p test_scoreboard.py -v
          python -B -m unittest discover -s 自动运行 -p test_continuous_history.py -v
          python -B -m unittest discover -s 自动运行 -p test_square_frontier.py -v
          python -B -m unittest discover -s 四境驿站 -p test_subscription_worker.py -v
          python -B -m unittest discover -s 微观生命海 -p test_subscription.py -v
          python -B 自动运行/test_judge.py
          python -B -m unittest discover -s 方格子容纳 -p test_game.py -v
          python -B 四境驿站/test_solo_server.py

  artifact:
    name: Downloadable source ZIP
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build source ZIP
        run: python -B release.py --source-only --out token-killer-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: token-killer-source
          path: token-killer-source.zip
          if-no-files-found: error
